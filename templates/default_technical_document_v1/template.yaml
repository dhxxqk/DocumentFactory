id: DEFAULT_TECHNICAL_DOCUMENT_V1
name: DocumentFactory默认技术文档规范
version: "1.0"
category:
  - technical_document
  - default
description: |
  DocumentFactory 默认技术文档格式规范 V1，是所有业务文档模板的统一格式
  父模板。它只定义与业务无关的通用格式事实：A4 页面、仿宋正文、黑体多级
  标题、表格与图表题注规则；不包含任何项目名称、编号、章节命名或
  特定单位信息。业务模板（科研实施方案、技术方案、验收报告等）通过
  extends 继承本规范，仅扩展业务身份与特殊规则。
  字号映射：三号=16pt、四号=14pt、小四=12pt、五号=10.5pt。

metadata:
  kind: default_style_specification
  abstracted_from: 通用技术报告格式实践（与电网科技项目实施方案文档格式规范 V1.4 参数同构）
  definition: templates/default_technical_document_v1/definition/style_definition.yaml
  rule_file: rules/default_technical_document_v1.yaml
  business_content: none
  author: DocumentFactory
  created_at: "2026-09-23"

# 规范事实按维度分片维护（唯一人工编辑源）；loader 按序深合并为完整 rules。
# 同文件内联 rules（若有）优先级高于分片，业务模板可在 extends 之上覆盖。
rules_include:
  - rules/page_rules.yaml
  - rules/paragraph_rules.yaml
  - rules/heading_rules.yaml
  - rules/table_rules.yaml
  - rules/figure_rules.yaml
