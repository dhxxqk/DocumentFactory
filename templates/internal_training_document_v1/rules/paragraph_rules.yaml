# 内部培训管理规范模板 — 正文规则分片。
# 源文档正文主流事实：宋体（中英文槽位均为宋体）、小四 12pt；
# 1.5 倍行距（line=360/auto 主流）；首行缩进 2 字符（firstLineChars=200）；
# 两端对齐（jc=both 主流）；段前段后 0。
body:
  style_name: Normal
  chinese_font: 宋体
  latin_font: 宋体
  font_size_pt: 12
  first_line_indent_chars: 2
  line_spacing: 1.5
  space_before_pt: 0
  space_after_pt: 0
  alignment: both
