[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-factory"
version = "0.4.0a1"
description = "Deterministic DOCX audit, normalization, template migration, validation, MCP, and rendering pipeline"
requires-python = ">=3.10"
dependencies = ["lxml>=5,<7", "PyYAML>=6,<7", "PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "mcp>=2,<3"]
mcp = ["mcp>=2,<3"]
word = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
document-factory = "document_factory.cli:main"
document-factory-mcp = "document_factory.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
