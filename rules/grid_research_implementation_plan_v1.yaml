# 字号：三号 16pt、四号 14pt、小四 12pt、五号 10.5pt。
document:
  page_size: A4
  page_size_twips: [11906, 16838]
  orientation: portrait
  margins_cm: {top: 2.8, bottom: 2.6, left: 2.8, right: 2.6}
  tolerance_twips: 3
body:
  style_name: 正文
  chinese_font: 仿宋
  latin_font: Times New Roman
  font_size_pt: 12
  first_line_indent_chars: 2
  line_spacing: 1.5
  space_before_pt: 0
  space_after_pt: 0
  alignment: both
heading1: {word_style: Heading 1, chinese_font: 黑体, size_pt: 16, color: '000000'}
heading2: {word_style: Heading 2, chinese_font: 黑体, size_pt: 14, color: '000000'}
heading3: {word_style: Heading 3, chinese_font: 黑体, size_pt: 12, color: '000000'}
toc:
  required: true
  levels: [1, 2]
  expected_field_logic: 'TOC \o "1-2" \h \z \u'
  update_fields: true
numbering:
  automatic_multilevel_required: true
  manual_heading_number_forbidden: true
  manual_patterns:
    - '^\s*\d+(?:\.\d+){0,2}(?=[\s、．.)）\u4e00-\u9fff]|$)'
    - '^\s*[一二三四五六七八九十百]+、'
    - '^\s*[（(][一二三四五六七八九十百]+[）)]'
tables:
  required_styles: [表格表头, 表格正文]
  optional_styles: [表格正文-居中]
  header_strategy: first_row_or_repeat
  cover_style_pattern: '^(封面|cover)'
  first_line_indent: 0
  left_indent: 0
  right_indent: 0
  space_before_pt: 0
  space_after_pt: 0
  header_font: 黑体
  body_font: 仿宋
  latin_font: Times New Roman
  font_size_pt: 10.5
  line_spacing_allowed: [single, exact]
  normalization_line_spacing: single
font_aliases:
  仿宋: [仿宋, FangSong]
  黑体: [黑体, SimHei]
  Times New Roman: [Times New Roman]
